# Application Configuration - IoT Home Automation System
spring.application.name=iot-home-automation
server.port=8080

# Default profile is H2 for immediate, zero-friction startup.
# To switch to MySQL, launch with: --spring.profiles.active=mysql
spring.profiles.active=${SPRING_PROFILES_ACTIVE:h2}

# Security & JWT Configuration
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.expiration-ms=86400000

# ESP32 Device Protocol Configuration
app.esp32.device-token-header=X-Device-Token
app.esp32.device-key-header=X-Device-Key
app.esp32.offline-threshold-seconds=35
app.esp32.command-timeout-seconds=20

# Actuator Endpoints
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# Logging
logging.level.com.homeauto=INFO
logging.level.org.springframework.security=WARN
