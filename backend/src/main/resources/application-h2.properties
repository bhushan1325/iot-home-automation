# In-Memory H2 Configuration for instant dev & testing
spring.datasource.url=jdbc:h2:mem:home_automation;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

app.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
app.jwt.expiration-ms=86400000
app.esp32.device-token-header=X-Device-Token
app.esp32.device-key-header=X-Device-Key
app.esp32.offline-threshold-seconds=35
app.esp32.command-timeout-seconds=20
