# Application Configuration - IoT Home Automation System
spring.application.name=iot-home-automation
server.port=8080

# Database Configuration (MySQL 8.x with Environment Variable overrides)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/home_automation?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Security & JWT Configuration
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.expiration-ms=86400000

# ESP32 Device Protocol Configuration
app.esp32.device-token-header=X-Device-Token
app.esp32.device-key-header=X-Device-Key
app.esp32.offline-threshold-seconds=35
app.esp32.command-timeout-seconds=20

# Actuator Endpoints
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# Logging
logging.level.com.homeauto=INFO
logging.level.org.springframework.security=WARN
